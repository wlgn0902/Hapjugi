<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light;--bg:#fff;--panel:#f0f2f6;--text:#262730;--muted:#60646f;--border:#d8dbe2;--empty:#fff;--blocked:#dfe2e8;--hover:#ff4b4b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
.wrap{width:100%;overflow-x:auto;overflow-y:visible;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:max-content;width:max-content}
th,td{padding:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center}
thead th{position:sticky;top:0;z-index:4;height:42px;background:var(--panel);color:var(--text);font-size:12px;font-weight:600;min-width:42px}
th.time{position:sticky;left:0;z-index:5;width:76px;min-width:76px;background:var(--panel);color:var(--muted);text-align:right;padding-right:7px;font-size:11px}
tbody th.time{height:18px;font-weight:400;color:var(--muted)}
td.slot{width:42px;min-width:42px;height:18px;background:var(--empty);cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
td.slot:hover{outline:1px solid var(--hover);outline-offset:-1px;position:relative;z-index:3}
td.blocked{background:var(--blocked)!important;cursor:not-allowed}
td.hidden{visibility:hidden;border:0!important;background:transparent!important;pointer-events:none;outline:0!important}
td.fully-available{background:#00C853}
td.maybe-available{background:#FFD600}
td.uncomfortable{background:#FF6D00}
td.unavailable{background:#F44336}
td.masked{background:var(--masked)!important}
td.ideal-highlight{position:relative;z-index:2}
td.ideal-highlight::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid #1677ff;z-index:5}
td.ideal-top::after{border-top-width:3px}td.ideal-right::after{border-right-width:3px}td.ideal-bottom::after{border-bottom-width:3px}td.ideal-left::after{border-left-width:3px}
#member-tooltip{display:none;position:fixed;z-index:10000;pointer-events:none;min-width:160px;max-width:260px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.18);font-size:12px}
#member-tooltip .tooltip-title{font-weight:700;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)}
#member-tooltip .tooltip-member{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0}
#member-tooltip .tooltip-name{overflow-wrap:anywhere}
#member-tooltip .status-dot{display:inline-block;width:13px;height:13px;flex:0 0 13px;border-radius:50%;border:1px solid var(--muted)}
#member-tooltip .status-dot.missing{background:transparent;border:2px dashed var(--muted)}
td.preview{background:var(--preview-fill,var(--empty))!important;outline:2px solid var(--text);outline-offset:-2px;position:relative;z-index:3}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg);border-bottom:1px solid var(--border)}
.status-btn{display:inline-flex;align-items:center;justify-content:center;gap:0;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:700;text-align:center;background:var(--panel);color:var(--text);cursor:pointer;transition:background-color .06s,border-color .06s;flex:1 1 auto;min-height:36px}
.status-btn::before{content:"";display:inline-block;flex:0 0 15px;width:15px;height:15px;border-radius:50%;margin-right:7px;background:var(--swatch,var(--text))}
.status-btn[data-status="입력 지우기"]::before{display:none;margin:0}
.status-btn[aria-pressed="true"]{border-color:var(--swatch,var(--text));background:var(--swatch,var(--panel));color:#111!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.status-btn[aria-pressed="true"]::before{display:none}
.status-btn[data-status="합주 완전 불가"][aria-pressed="true"]{color:#fff!important}
.status-btn[data-status="입력 지우기"][aria-pressed="true"]{background:var(--panel);color:var(--text);outline:2px solid var(--text);outline-offset:1px}
.status-btn:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
.err{padding:12px;color:#b91c1c;font-size:13px;white-space:pre-wrap}
@media(max-width:700px){th.time{width:62px;min-width:62px}td.slot{width:38px;min-width:38px}thead th{height:38px;font-size:11px}.status-btn{padding:7px 8px}}
</style>
</head>
<body>
<div id="error" class="err" hidden></div>
<div id="member-tooltip" role="tooltip"></div>
<div class="wrap" id="wrap"><div id="toolbar" class="toolbar" role="group" aria-label="입력할 상태"></div><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<script>
'use strict';
let args=null,themeSignature='',dragging=false,dragPointerId=null,selected=new Set(),dragStatus=null,selectedStatus=null,lastServerSelected=null,builtSignature='',pending=new Map(),lastResetToken=null,dragStartCell=null,lastDragCellKey=null,tooltipKey=null;
const STATUS_LIST=[['합주 완전 가능','fully-available','#00C853'],['합주 가능(애매)','maybe-available','#FFD600'],['합주 가능(불편)','uncomfortable','#FF6D00'],['합주 완전 불가','unavailable','#F44336'],['입력 지우기','clear-status','transparent']];
const STATUS_CSS_CLASSES=Object.fromEntries(STATUS_LIST.filter(x=>x[1]!=='clear-status').map(x=>[x[0],x[1]]));
const STATUS_COLORS=Object.fromEntries(STATUS_LIST.filter(x=>x[1]!=='clear-status').map(x=>[x[0],x[2]]));
function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function setHeight(){requestAnimationFrame(()=>{const w=document.querySelector('#wrap');post('streamlit:setFrameHeight',{height:Math.max(100,Math.ceil(w?w.getBoundingClientRect().height:100)+4)})})}
function send(value){value.event_id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);post('streamlit:setComponentValue',{value,dataType:'json'})}
function timeKey(m){if(typeof m==='string'&&m.includes(':')){const p=m.split(':');return String(Number(p[0])).padStart(2,'0')+':'+String(Number(p[1])).padStart(2,'0')}return String(Math.floor(Number(m)/60)).padStart(2,'0')+':'+String(Number(m)%60).padStart(2,'0')}
function minuteLabel(m){let h=Math.floor(m/60);if(h===0)return'오전 12시';if(h<12)return'오전 '+h+'시';if(h===12)return'오후 12시';return'오후 '+(h-12)+'시'}
function applyTheme(t){if(!t||typeof t!=='object')return;const base=t.base==='dark'?'dark':'light',bg=t.backgroundColor||(base==='dark'?'#0e1117':'#fff'),panel=t.secondaryBackgroundColor||(base==='dark'?'#262730':'#f0f2f6'),color=t.textColor||(base==='dark'?'#fafafa':'#262730'),primary=t.primaryColor||'#ff4b4b',sig=[base,bg,panel,color,primary].join('|');if(sig===themeSignature)return;themeSignature=sig;const r=document.documentElement;r.style.colorScheme=base;r.style.setProperty('--bg',bg);r.style.setProperty('--panel',panel);r.style.setProperty('--text',color);r.style.setProperty('--muted',base==='dark'?'#aab1bc':'#60646f');r.style.setProperty('--border',base==='dark'?'#3a3d46':'#d8dbe2');r.style.setProperty('--empty',bg);r.style.setProperty('--blocked',base==='dark'?'#343943':'#dfe2e8');r.style.setProperty('--masked',base==='dark'?'#ffffff':'#111111');r.style.setProperty('--ideal-border',base==='dark'?'#ffffff':'#111111');r.style.setProperty('--hover',primary)}
function showError(msg){const e=document.getElementById('error');e.hidden=false;e.textContent='시간표를 불러오지 못했습니다.\n'+msg;document.getElementById('wrap').hidden=true;setHeight()}
function makeToolbar(){const bar=document.getElementById('toolbar');if(!args.editable){bar.hidden=true;bar.innerHTML='';return}bar.hidden=false;bar.innerHTML='';STATUS_LIST.forEach(([label,cls,color])=>{const b=document.createElement('button');b.type='button';b.className='status-btn';b.textContent=label;b.dataset.status=label;if(color!=='transparent')b.style.setProperty('--swatch',color);b.setAttribute('aria-pressed',String(selectedStatus===label));b.addEventListener('click',()=>{selectedStatus=label;bar.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.status===selectedStatus)))});bar.appendChild(b)})}
function buildTable(){const head=document.getElementById('head'),body=document.getElementById('body');head.innerHTML='';body.innerHTML='';const corner=document.createElement('th');corner.className='time';corner.textContent='시간';head.appendChild(corner);const days='월화수목금토일';args.dates.forEach(d=>{const th=document.createElement('th'),dt=new Date(d+'T00:00:00');th.innerHTML=d.slice(5).replace('-','/')+'<br>'+days[(dt.getDay()+6)%7];head.appendChild(th)});args.minutes.forEach(m=>{if((args.hidden_rows||[]).includes(timeKey(m)))return;const tr=document.createElement('tr');tr.dataset.minute=timeKey(m);const time=document.createElement('th');time.className='time';time.textContent=Number(m)%60===0?minuteLabel(Number(m)):'';tr.appendChild(time);args.dates.forEach(d=>{const td=document.createElement('td');td.className='slot';td.dataset.key=d+'|'+timeKey(m);tr.appendChild(td)});body.appendChild(tr)});builtSignature=JSON.stringify([args.dates,args.minutes,args.hidden_rows||[]])}
function paintPreview(){document.querySelectorAll('td.preview').forEach(td=>{td.classList.remove('preview');td.style.removeProperty('--preview-fill')});selected.forEach(k=>{const td=document.querySelector('td[data-key="'+CSS.escape(k)+'"]');if(td){td.classList.add('preview');const color=(STATUS_LIST.find(x=>x[0]===dragStatus)||[])[2];if(color&&color!=='transparent')td.style.setProperty('--preview-fill',color)}})}
function refreshCells(){const blocked=new Set(args.blocked||[]),hidden=new Set(args.hidden||[]),statuses=args.statuses||{},cellColors=args.cell_colors||{},idealKeys=new Set(args.ideal_keys||[]);document.querySelectorAll('td.slot').forEach(td=>{const key=td.dataset.key,has=pending.has(key),status=has?pending.get(key):(statuses[key]||'');if(has&&(statuses[key]||'')===status)pending.delete(key);td.classList.remove('fully-available','maybe-available','uncomfortable','unavailable','blocked','masked','hidden','preview','ideal-highlight','ideal-top','ideal-right','ideal-bottom','ideal-left');td.style.removeProperty('--preview-fill');td.style.removeProperty('background-color');if(STATUS_CSS_CLASSES[status])td.classList.add(STATUS_CSS_CLASSES[status]);if(status==='__masked__')td.classList.add('masked');if(cellColors[key])td.style.backgroundColor=cellColors[key];if(idealKeys.has(key))td.classList.add('ideal-highlight');if(blocked.has(key))td.classList.add('blocked');if(hidden.has(key))td.classList.add('hidden');if(args.editable&&!td.classList.contains('blocked')&&!td.classList.contains('hidden'))td.title=key.replace('|',' ')+' · '+(status||'미입력');else td.removeAttribute('title')});
// Draw one continuous blue outline around each connected region of ideal cells.
const rows=[...document.querySelectorAll('#body tr')];const rowIndex=new Map(rows.map((tr,i)=>[tr,i]));const cells=new Map([...document.querySelectorAll('td.slot')].map(td=>[td.dataset.key,td]));
idealKeys.forEach(key=>{const td=cells.get(key);if(!td)return;const ri=rowIndex.get(td.parentElement),ci=td.cellIndex;const date=key.split('|')[0],minute=key.split('|')[1];const prevMinute=String(Math.max(0,Number(minute.slice(0,2))*60+Number(minute.slice(3))-15)).padStart(4,'0');const nextMinute=String(Math.min(1439,Number(minute.slice(0,2))*60+Number(minute.slice(3))+15)).padStart(4,'0');const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');const topKey=date+'|'+fmt(Number(minute.slice(0,2))*60+Number(minute.slice(3))-15),bottomKey=date+'|'+fmt(Number(minute.slice(0,2))*60+Number(minute.slice(3))+15);const left=td.previousElementSibling,right=td.nextElementSibling;const topRow=rows[ri-1],bottomRow=rows[ri+1];const top=topRow&&topRow.cells[ci],bottom=bottomRow&&bottomRow.cells[ci];if(!top||!idealKeys.has(top.dataset.key))td.classList.add('ideal-top');if(!right||!idealKeys.has(right.dataset.key))td.classList.add('ideal-right');if(!bottom||!idealKeys.has(bottom.dataset.key))td.classList.add('ideal-bottom');if(!left||!idealKeys.has(left.dataset.key))td.classList.add('ideal-left')});paintPreview()}
function render(){if(!args||!Array.isArray(args.dates)||!Array.isArray(args.minutes)){showError('앱에서 날짜/시간 정보를 받지 못했습니다.');return}document.getElementById('error').hidden=true;document.getElementById('wrap').hidden=false;applyTheme(args.__theme);if(lastResetToken!==args.reset_token){if(lastResetToken!==null){pending.clear();selected.clear();dragging=false;dragPointerId=null;dragStartCell=null;lastDragCellKey=null;dragStatus=null}lastResetToken=args.reset_token}if(lastServerSelected!==args.selected_status){lastServerSelected=args.selected_status;if(selectedStatus===null)selectedStatus=args.selected_status||'합주 완전 가능'}const sig=JSON.stringify([args.dates,args.minutes,args.hidden_rows||[]]);if(sig!==builtSignature)buildTable();makeToolbar();refreshCells();setHeight()}
function getCellAtPoint(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('td.slot'):null}
function canPaint(td){return!!(td&&args&&args.editable&&!td.classList.contains('blocked')&&!td.classList.contains('hidden'))}
function selectRectangle(endCell){if(!dragStartCell||!canPaint(endCell))return;if(lastDragCellKey===endCell.dataset.key)return;lastDragCellKey=endCell.dataset.key;const startRow=dragStartCell.parentElement.rowIndex,endRow=endCell.parentElement.rowIndex,startCol=dragStartCell.cellIndex,endCol=endCell.cellIndex;const minRow=Math.min(startRow,endRow),maxRow=Math.max(startRow,endRow),minCol=Math.min(startCol,endCol),maxCol=Math.max(startCol,endCol);const next=new Set();const rows=document.querySelectorAll('#body tr');rows.forEach(tr=>{const rowIndex=tr.rowIndex;if(rowIndex<minRow||rowIndex>maxRow)return;for(let col=minCol;col<=maxCol;col++){const td=tr.cells[col];if(canPaint(td))next.add(td.dataset.key)}});selected=next;paintPreview()}
function finish(e){if(!dragging)return;if(e&&dragPointerId!==null&&e.pointerId!==undefined&&e.pointerId!==dragPointerId)return;const endCell=e&&typeof e.clientX==='number'?getCellAtPoint(e.clientX,e.clientY):null;if(canPaint(endCell))selectRectangle(endCell);dragging=false;dragPointerId=null;dragStartCell=null;lastDragCellKey=null;if(selected.size){const status=dragStatus||selectedStatus||args.selected_status,cells=[...selected].map(k=>{const[date,minute]=k.split('|');return{date,minute}});cells.forEach(c=>pending.set(c.date+'|'+timeKey(c.minute),status==='입력 지우기'?'':status));refreshCells();send({action:'paint',cells,status})}selected.clear();dragStatus=null;paintPreview()}
document.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;const td=e.target.closest&&e.target.closest('td.slot');if(!canPaint(td))return;e.preventDefault();dragging=true;dragPointerId=e.pointerId;dragStartCell=td;lastDragCellKey=td.dataset.key;selected=new Set([td.dataset.key]);dragStatus=selectedStatus||args.selected_status;paintPreview();try{td.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
document.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragPointerId)return;const td=getCellAtPoint(e.clientX,e.clientY);if(canPaint(td))selectRectangle(td)},{passive:true});
document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',finish);window.addEventListener('blur',()=>finish());
function hideMemberTooltip(){const tip=document.getElementById('member-tooltip');if(tip)tip.style.display='none';tooltipKey=null}
function positionMemberTooltip(tip,x,y){const pad=12;const rect=tip.getBoundingClientRect();tip.style.left=Math.max(pad,Math.min(x+14,window.innerWidth-rect.width-pad))+'px';tip.style.top=Math.max(pad,Math.min(y+14,window.innerHeight-rect.height-pad))+'px'}
function showMemberTooltip(td,x,y){const key=td.dataset.key;const tip=document.getElementById('member-tooltip');if(!tip){return}const ideal=new Set(args&&args.ideal_keys||[]);if(ideal.has(key)){if(tooltipKey!==key){tip.innerHTML='';const title=document.createElement('div');title.className='tooltip-title';title.textContent='모두 가능!';tip.appendChild(title);tooltipKey=key}tip.style.display='block';positionMemberTooltip(tip,x,y);return}const details=args&&args.cell_details&&args.cell_details[key];if(!Array.isArray(details)||!details.length){hideMemberTooltip();return}if(tooltipKey!==key){tip.innerHTML='';const title=document.createElement('div');title.className='tooltip-title';title.textContent=key.replace('|',' · ');tip.appendChild(title);details.forEach(item=>{const row=document.createElement('div');row.className='tooltip-member';const name=document.createElement('span');name.className='tooltip-name';name.textContent=item.name||'이름 없음';const dot=document.createElement('span');dot.className='status-dot';const color=STATUS_COLORS[item.status];if(color){dot.style.backgroundColor=color;dot.style.borderColor=color;}else dot.classList.add('missing');dot.setAttribute('aria-label',item.status||'미응답');row.append(name,dot);tip.appendChild(row)});tooltipKey=key}tip.style.display='block';positionMemberTooltip(tip,x,y)}
document.addEventListener('pointerover',e=>{if(args&&args.editable)return;const td=e.target.closest&&e.target.closest('td.slot');if(td&&args&&args.cell_details)showMemberTooltip(td,e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{if(args&&args.editable)return;const td=e.target.closest&&e.target.closest('td.slot');if(td&&args&&args.cell_details)showMemberTooltip(td,e.clientX,e.clientY)});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('td.slot')&&(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('td.slot')))hideMemberTooltip()});
window.addEventListener('scroll',hideMemberTooltip,true);window.addEventListener('blur',hideMemberTooltip);
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='streamlit:render')return;const n=d.args||d;args={...n,__theme:d.theme||n.theme};try{render()}catch(err){showError(String(err))}});post('streamlit:componentReady',{apiVersion:1});setHeight();
</script>
</body>
</html>
