<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:white}
.wrap{width:100%;overflow:auto;border:1px solid #d1d5db;border-radius:10px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:max-content}
th,td{padding:0;border-right:1px solid #d1d5db;border-bottom:1px solid #d1d5db;text-align:center}
thead th{position:sticky;top:0;z-index:4;height:42px;background:#f8fafc;font-size:12px;font-weight:600}
th.time{position:sticky;left:0;z-index:5;width:76px;min-width:76px;background:#f8fafc;text-align:right;padding-right:7px;font-size:11px}
tbody th.time{height:18px;font-weight:400;color:#4b5563}
td.slot{width:42px;min-width:42px;height:18px;background:#fff;cursor:pointer;user-select:none;touch-action:none}
td.slot:hover{outline:2px solid #111827;outline-offset:-2px;z-index:3}
td.blocked{background:#374151!important;cursor:not-allowed}td.hidden{visibility:hidden;border:0!important;background:transparent!important;pointer-events:none}
td.fully-available{background:#16a34a}td.maybe-available{background:#facc15}td.uncomfortable{background:#f97316}td.unavailable{background:#ef4444}td.preview{outline:2px solid #111827;outline-offset:-2px;filter:brightness(.88)}
@media(max-width:700px){th.time{width:62px;min-width:62px}td.slot{width:38px;min-width:38px}thead th{height:38px;font-size:11px}}
</style>
</head><body><div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<script>
let args={};let dragging=false;let startKey=null;let selected=new Set();
const COLORS={'합주 완전 가능':'fully-available','합주 가능(애매)':'maybe-available','합주 가능(불편)':'uncomfortable','합주 완전 불가':'unavailable'};
function send(msg){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:msg},'*');}
function height(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight},'*');}
function render(){
 const head=document.getElementById('head'), body=document.getElementById('body');head.innerHTML='';body.innerHTML='';
 const th=document.createElement('th');th.className='time';th.textContent='시간';head.appendChild(th);
 const wd='월화수목금토일';
 args.dates.forEach(d=>{const x=document.createElement('th');const dt=new Date(d+'T00:00:00');x.innerHTML=d.slice(5).replace('-','/')+'<br>'+wd[dt.getDay()==0?6:dt.getDay()-1];head.appendChild(x)});
 args.minutes.forEach(m=>{
  const tr=document.createElement('tr');const time=document.createElement('th');time.className='time';time.textContent=(m%60===0)?hour(m):'';tr.appendChild(time);
  args.dates.forEach(d=>{const key=d+'|'+mins(m);const td=document.createElement('td');td.className='slot';td.dataset.key=key;const st=args.statuses[key]||'';if((args.hidden||[]).includes(key))td.classList.add('hidden');if(COLORS[st])td.classList.add(COLORS[st]);if((args.blocked||[]).includes(key))td.classList.add('blocked');
   if(args.editable&&!td.classList.contains('blocked')&&!td.classList.contains('hidden')){td.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;startKey=key;selected=new Set([key]);paintPreview();td.setPointerCapture(e.pointerId)});td.addEventListener('pointerenter',()=>{if(dragging){selected.add(key);paintPreview()}});td.addEventListener('pointerup',()=>finish());}
   tr.appendChild(td);});body.appendChild(tr);
 });height();
}
function mins(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function hour(m){let h=Math.floor(m/60);if(h===0)return '오전 12시';if(h<12)return '오전 '+h+'시';if(h===12)return '오후 12시';return '오후 '+(h-12)+'시'}
function paintPreview(){document.querySelectorAll('td[data-key].preview').forEach(x=>x.classList.remove('preview'));selected.forEach(k=>{const x=document.querySelector('td[data-key="'+CSS.escape(k)+'"]');if(x)x.classList.add('preview')})}
function finish(){if(!dragging)return;dragging=false;if(!selected.size)return;send({action:'paint',cells:[...selected].map(k=>{const [date,minute]=k.split('|');return {date,minute}}),status:args.selected_status});selected.clear();}
window.addEventListener('pointerup',finish);
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};render();});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
